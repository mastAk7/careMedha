<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Medical Triage Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .triage-emergency {
            background-color: #fef2f2;
            border-color: #fca5a5;
            color: #b91c1c;
        }
        .triage-consultation {
            background-color: #fffbeb;
            border-color: #fcd34d;
            color: #b45309;
        }
        .triage-self_care {
            background-color: #f0fdf4;
            border-color: #86efac;
            color: #15803d;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-2xl mx-auto p-4 md:p-6">
        <div class="bg-white rounded-2xl shadow-lg p-6 md:p-8">
            <header class="text-center mb-6">
                <h1 class="text-3xl font-bold text-gray-800">AI Medical Triage Assistant</h1>
                <p class="text-gray-500 mt-2">Enter your symptoms below for a preliminary analysis.</p>
                <p class="text-xs text-red-600 mt-2 font-semibold">Disclaimer: This is not a substitute for professional medical advice.</p>
            </header>
            
            <main>
                <!-- Symptom Input Form -->
                <div class="mb-4">
                    <label for="symptoms" class="block text-sm font-medium text-gray-700 mb-2">Your Symptoms:</label>
                    <textarea id="symptoms" rows="5" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" placeholder="e.g., I have a high fever, a sore throat, and a headache..."></textarea>
                </div>
                
                <button id="check-btn" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-300 ease-in-out flex items-center justify-center">
                    <span id="btn-text">Check Symptoms</span>
                    <!-- Spinner Icon -->
                    <svg id="spinner" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>

                <!-- Error Message Display -->
                <div id="error-message" class="hidden mt-4 p-4 bg-red-100 border border-red-300 text-red-800 rounded-lg"></div>
                
                <!-- Results Display -->
                <div id="results" class="hidden mt-6 border-t pt-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4">Analysis Result:</h2>
                    
                    <div id="triage-card" class="p-4 rounded-lg border mb-4">
                        <h3 class="text-lg font-bold">Triage Level: <span id="triage-level" class="capitalize"></span></h3>
                    </div>
                    
                    <div class="bg-gray-100 p-4 rounded-lg mb-4">
                        <h3 class="font-semibold text-gray-700 mb-2">Symptom Summary:</h3>
                        <p id="summary" class="text-gray-600"></p>
                    </div>

                    <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                        <h3 class="font-semibold text-blue-800 mb-2">Recommendation (in Punjabi):</h3>
                        <p id="recommendation" class="text-blue-700 font-medium"></p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const symptomsInput = document.getElementById('symptoms');
        const checkBtn = document.getElementById('check-btn');
        const btnText = document.getElementById('btn-text');
        const spinner = document.getElementById('spinner');
        const resultsDiv = document.getElementById('results');
        const errorMessageDiv = document.getElementById('error-message');
        
        const triageLevelEl = document.getElementById('triage-level');
        const triageCardEl = document.getElementById('triage-card');
        const summaryEl = document.getElementById('summary');
        const recommendationEl = document.getElementById('recommendation');

        // The URL is now a relative path, as the page is served by the same app
        const API_URL = '/api/symptom-check';

        checkBtn.addEventListener('click', async () => {
            const symptoms = symptomsInput.value.trim();
            if (!symptoms) {
                displayError('Please enter your symptoms before checking.');
                return;
            }
            
            setLoadingState(true);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: symptoms }),
                });

                const data = await response.json();

                if (!response.ok) {
                    // Throw an error with the message from the backend
                    throw new Error(data.error || `HTTP error! Status: ${response.status}`);
                }

                displayResults(data);

            } catch (error) {
                console.error('Error:', error);
                displayError(error.message || 'An unknown error occurred. Please try again.');
            } finally {
                setLoadingState(false);
            }
        });

        function setLoadingState(isLoading) {
            if (isLoading) {
                checkBtn.disabled = true;
                btnText.textContent = 'Analyzing...';
                spinner.classList.remove('hidden');
                resultsDiv.classList.add('hidden');
                errorMessageDiv.classList.add('hidden');
            } else {
                checkBtn.disabled = false;
                btnText.textContent = 'Check Symptoms';
                spinner.classList.add('hidden');
            }
        }

        function displayResults(data) {
            triageLevelEl.textContent = data.triage_level.replace('_', ' ');
            summaryEl.textContent = data.summary_of_symptoms;
            recommendationEl.textContent = data.recommendation_text_punjabi;
            
            // Apply dynamic styling based on triage level
            triageCardEl.className = 'p-4 rounded-lg border mb-4'; // Reset classes
            triageCardEl.classList.add(`triage-${data.triage_level}`);

            resultsDiv.classList.remove('hidden');
            errorMessageDiv.classList.add('hidden');
        }

        function displayError(message) {
            errorMessageDiv.textContent = message;
            errorMessageDiv.classList.remove('hidden');
            resultsDiv.classList.add('hidden');
        }

    </script>
</body>
</html>
